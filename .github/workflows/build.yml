name: Build Netlify MC (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set release version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = "0.1.$env:GITHUB_RUN_NUMBER"
          $package | ConvertTo-Json -Depth 100 | Set-Content package.json
          Write-Host "Building Netlify MC version $($package.version)"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installers and update metadata
        run: npm run build

      - name: Publish update files and direct EXE downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: netlify-mc-build-${{ github.run_number }}
          name: Netlify MC Windows Build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
