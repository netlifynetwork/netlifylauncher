name: Build Netlify MC
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-mc-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error
