name: Build Netlify MC (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installers
        run: npm run build

      - name: Publish direct EXE downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: netlify-mc-build-${{ github.run_number }}
          name: Netlify MC Windows Build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            dist/*.exe
